<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opinion Lab</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f8fc;
  --ink: #0b0b0b;
  --ink-2: #4a5160;
  --dot: #2a78d6;
  --accent: #1c5cab;
  --accent-hover: #184f95;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { min-height: 100vh; }
body {
  background: var(--page); color: var(--ink); overflow: hidden;
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.center {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  padding: 0 16px;
}
.stack {
  display: grid; justify-items: center; gap: 22px; text-align: center; margin-top: 18vh;
  pointer-events: none;
}
.line {
  margin: 0; max-width: 34ch; font-size: clamp(17px, 2.2vw, 21px); color: var(--ink-2);
  letter-spacing: -0.005em; text-wrap: balance;
  text-shadow: 0 0 18px var(--page), 0 0 8px var(--page), 0 0 2px var(--page);
}
.enter {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 12px;
  border: 0; border-radius: 999px; padding: 15px 30px 15px 32px;
  background: var(--accent); color: #fff; font: 600 17px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: 0.01em; cursor: pointer; text-decoration: none;
  box-shadow: 0 10px 30px rgba(28, 92, 171, 0.28), 0 0 0 10px rgba(245, 248, 252, 0.85);
  transition: transform .25s ease, background .2s ease, box-shadow .25s ease;
}
.enter:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 16px 40px rgba(28, 92, 171, 0.34), 0 0 0 10px rgba(245, 248, 252, 0.85); }
.enter:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.enter .arrow { transition: transform .25s ease; }
.enter:hover .arrow { transform: translateX(4px); }
.hint {
  margin: 0; font-size: 13px; color: var(--ink-2); opacity: .75;
  text-shadow: 0 0 10px var(--page), 0 0 4px var(--page);
}
.fade { position: fixed; inset: 0; background: var(--page); opacity: 0; pointer-events: none; transition: opacity .55s ease; }
.leaving .fade { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .enter, .enter .arrow, .fade { transition: none; }
}
</style>
</head>
<body>
<canvas id="swarm" aria-hidden="true"></canvas>
<div class="center">
  <div class="stack">
    <p class="line">Every dot is an agent. Watch opinions gather, drift apart, and form camps.</p>
    <a class="enter" id="enter" href="/lab">Enter the lab <span class="arrow" aria-hidden="true">→</span></a>
    <p class="hint">Move your cursor through the swarm.</p>
  </div>
</div>
<div class="fade" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById("swarm");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DOT = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim();

  let W = 0, H = 0, DPR = 1, parts = [], camps = [], t0 = performance.now();
  const pointer = { x: -9999, y: -9999, active: false };
  let burst = null, leaving = false;

  // A few slowly wandering "camps" the dots are loosely drawn to; every so often a dot
  // changes camp, the way an opinion changes.
  function makeCamps() {
    const k = W < 700 ? 3 : 4;
    camps = Array.from({ length: k }, (_, i) => ({
      phase: (i / k) * Math.PI * 2,
      rx: 0.28 + 0.08 * Math.random(),
      ry: 0.22 + 0.06 * Math.random(),
      sp: 0.00005 + 0.00004 * Math.random(),
      x: W / 2, y: H / 2,
    }));
  }
  function placeCamps(time) {
    camps.forEach((c, i) => {
      const a = c.phase + time * c.sp;
      c.x = W / 2 + Math.cos(a) * W * c.rx;
      c.y = H * 0.46 + Math.sin(a * 1.3 + i) * H * c.ry;
    });
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeCamps(); placeCamps(0);
    const n = Math.round(Math.min(1500, Math.max(320, (W * H) / 1050)));
    parts = Array.from({ length: n }, () => {
      const camp = Math.floor(Math.random() * camps.length);
      const c = camps[camp], ang = Math.random() * Math.PI * 2, r = Math.random() * Math.min(W, H) * 0.35;
      return {
        x: c.x + Math.cos(ang) * r, y: c.y + Math.sin(ang) * r,
        vx: 0, vy: 0, camp,
        r: 1.3 + Math.random() * 1.7,
        a: 0.45 + Math.random() * 0.5,
        spin: Math.random() < 0.5 ? 1 : -1,
        seed: Math.random() * 1000,
      };
    });
  }

  function step(now) {
    const time = now - t0;
    placeCamps(time);
    const R = 130, R2 = R * R;
    for (const p of parts) {
      const c = camps[p.camp];
      let dx = c.x - p.x, dy = c.y - p.y;
      const d = Math.hypot(dx, dy) + 0.001;
      // pull towards the camp plus a gentle orbit around it
      const pull = Math.min(0.018, d * 0.00006);
      p.vx += (dx / d) * pull * 3 + (-dy / d) * 0.012 * p.spin;
      p.vy += (dy / d) * pull * 3 + (dx / d) * 0.012 * p.spin;
      // wandering noise
      const s = p.seed + time * 0.0004;
      p.vx += Math.sin(s * 1.7) * 0.02;
      p.vy += Math.cos(s * 1.3) * 0.02;
      // pointer: dots flee the cursor
      if (pointer.active) {
        const px = p.x - pointer.x, py = p.y - pointer.y, pd2 = px * px + py * py;
        if (pd2 < R2) {
          const pd = Math.sqrt(pd2) + 0.001, f = (1 - pd / R) ** 2 * 2.4;
          p.vx += (px / pd) * f; p.vy += (py / pd) * f;
        }
      }
      // click or leave: a ring of push
      if (burst) {
        const bx = p.x - burst.x, by = p.y - burst.y, bd = Math.hypot(bx, by) + 0.001;
        const age = (now - burst.t) / 1000, front = age * 900;
        if (Math.abs(bd - front) < 90) { const f = burst.power * (1 - Math.abs(bd - front) / 90); p.vx += (bx / bd) * f; p.vy += (by / bd) * f; }
      }
      p.vx *= 0.94; p.vy *= 0.94;
      p.x += p.vx; p.y += p.vy;
      // rarely, change camp
      if (Math.random() < 0.00035) p.camp = Math.floor(Math.random() * camps.length);
      // wrap softly
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
    }
    if (burst && now - burst.t > 2200) burst = null;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = DOT;
    for (const p of parts) {
      ctx.globalAlpha = p.a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    step(now);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
  window.addEventListener("pointerleave", () => { pointer.active = false; });
  document.addEventListener("mouseleave", () => { pointer.active = false; });
  window.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".enter")) return;
    burst = { x: e.clientX, y: e.clientY, t: performance.now(), power: 1.4 };
  });

  // entering: scatter the swarm from the button, fade, then go
  const enter = document.getElementById("enter");
  enter.addEventListener("click", (e) => {
    if (leaving || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    leaving = true;
    const r = enter.getBoundingClientRect();
    burst = { x: r.left + r.width / 2, y: r.top + r.height / 2, t: performance.now(), power: 3.2 };
    document.body.classList.add("leaving");
    setTimeout(() => { window.location.href = enter.href; }, reduce ? 0 : 520);
  });
  window.addEventListener("pageshow", () => { leaving = false; document.body.classList.remove("leaving"); });

  resize();
  if (reduce) { for (let i = 0; i < 400; i++) step(t0 + i * 16); draw(); }
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
