<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opinion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
:root {
  color-scheme: light;
  --page: #ffffff;
  --left: #ffffff;
  --right: #e6f3fb;  /* cool sky blue, no violet cast */
  --dot: #2a78d6;
  --accent: #1c5cab;
  --accent-hover: #184f95;
}
* { box-sizing: border-box; }
html, body {
  min-height: 100vh; overflow: hidden;
  background: var(--left);
  font: 16px/1.5 "Geist", "Helvetica Neue", Arial, sans-serif;
}
/* the dots are drawn above the two coloured halves; clicks pass through to the links */
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; pointer-events: none; }
.layout {
  position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr;
  /* a soft blend between the halves instead of a hard edge */
  background: linear-gradient(90deg, var(--left) 0%, var(--left) 44%, var(--right) 56%, var(--right) 100%);
}
.left {
  display: grid; align-content: center; justify-items: start; gap: 26px;
  padding: 150px clamp(20px, 6vw, 96px) 48px; position: relative;
}
.copy { display: grid; gap: 20px; max-width: 560px; }
.copy h1 {
  margin: 0; color: #0b0b0b; text-wrap: balance;
  font: 700 clamp(40px, 4.6vw, 76px)/1.0 "Inter Tight", "Geist", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: -0.035em;
}
.copy h1 em { font-style: normal; color: #1c5cab; }
.copy p {
  margin: 0; max-width: 42ch; color: #4a5160;
  font: 400 clamp(16px, 1.3vw, 19px)/1.5 "Geist", "Helvetica Neue", Arial, sans-serif;
}
.enter {
  pointer-events: auto; position: relative; z-index: 2; display: inline-flex; align-items: center; justify-content: center;
  padding: 13px 24px; border-radius: 6px; background: #0b0b0b; color: #fff; text-decoration: none;
  font: 500 15px/1 "Geist", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.01em;
  transition: background .18s ease, transform .18s ease;
}
.enter:hover { background: #104281; }
.enter:active { transform: translateY(1px); }
.enter:focus-visible { outline: 2px solid #1c5cab; outline-offset: 3px; }
.right { display: grid; place-items: center; padding: 150px 32px 32px; }
/* desktop: double the left padding of the text half */
@media (min-width: 821px) {
  .left { padding-left: clamp(40px, 12vw, 192px); }
}
/* the plane is drawn on the full-screen canvas, centred on this box */
.ball { width: 100%; max-width: 760px; aspect-ratio: 1.15; }
@media (max-width: 820px) {
  .layout {
    grid-template-columns: 1fr; grid-template-rows: 52% 48%;
    background: linear-gradient(180deg, var(--left) 0%, var(--left) 46%, var(--right) 56%, var(--right) 100%);
  }
  .left { align-content: end; padding-top: 96px; padding-bottom: 28px; gap: 18px; }
  .right { padding: 8px 16px; }
  .ball { max-width: 440px; aspect-ratio: 1.3; }
}
.topbar {
  position: fixed; z-index: 5; top: 16px; left: 50%; transform: translateX(-50%);
  width: min(620px, calc(100% - 32px)); height: 56px; padding: 0 10px 0 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255, 255, 255, 0.75); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border: 1px solid #e3e5e9; border-radius: 12px;
}
.mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; }
.mark:focus-visible, .nav-link:focus-visible { outline: 2px solid #0b0b0b; outline-offset: 2px; }
.nav-link {
  padding: 8px 12px; border-radius: 7px; color: #0b0b0b; text-decoration: none;
  font: 500 15px/1 "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace, "Geist", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.01em;
  transition: background .15s ease, color .15s ease;
}
.nav-link:hover { background: #eef3fa; color: #104281; }
.nav { display: flex; align-items: center; gap: 2px; }
.nav-sep { width: 1px; height: 20px; background: #e3e5e9; margin: 0 6px; }
.icon-link {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 7px;
  color: #0b0b0b; transition: background .15s ease, color .15s ease;
}
.icon-link:hover { background: #eef3fa; color: #104281; }
.icon-link:focus-visible { outline: 2px solid #0b0b0b; outline-offset: 2px; }
@media (max-width: 700px) { .nav-link { padding: 8px 8px; font-size: 14px; } }
</style>
</head>
<body>
<canvas id="swarm" aria-hidden="true"></canvas>
<header class="topbar">
  <a class="mark" href="/" aria-label="Home">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <circle cx="11" cy="11" r="2.4" fill="#104281"/>
      <circle cx="5" cy="7" r="1.6" fill="#2a78d6"/><circle cx="16.5" cy="5.5" r="1.4" fill="#2a78d6" opacity=".75"/>
      <circle cx="17" cy="15" r="1.8" fill="#2a78d6" opacity=".9"/><circle cx="6.5" cy="16.5" r="1.3" fill="#2a78d6" opacity=".6"/>
      <circle cx="11" cy="3" r="1" fill="#2a78d6" opacity=".5"/><circle cx="11.5" cy="19.5" r="1" fill="#2a78d6" opacity=".5"/>
    </svg>
  </a>
  <nav class="nav">
    <a class="nav-link" href="/lab">Lab</a>
    <a class="nav-link" href="/docs">Docs</a>
    <span class="nav-sep" aria-hidden="true"></span>
    <a class="icon-link" href="https://github.com/theoradicella/agorasim" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
    </a>
    <a class="icon-link" href="https://pypi.org/project/agorasim/" target="_blank" rel="noopener" aria-label="Python package on PyPI" title="PyPI">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.8 20 7.2v9.6L12 21.2 4 16.8V7.2z"/><path d="M4 7.2 12 11.6l8-4.4M12 11.6v9.6"/>
      </svg>
    </a>
  </nav>
</header>
<div class="layout">
  <section class="left">
    <div class="copy">
      <h1>Watch opinions <em>form, split</em> and settle.</h1>
      <p>Language-model agents talk on a social network. See when they agree, when they polarize, and why.</p>
    </div>
    <a class="enter" href="/lab">Open the lab</a>
  </section>
  <section class="right">
    <div class="ball" id="ball"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById("swarm");
  const ctx = canvas.getContext("2d");
  const box = document.getElementById("ball");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DOT = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim();

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 200;
  let pts = [];
  const pointer = { x: -9999, y: -9999, active: false };
  let rotY = 0.6, tiltX = 0, tiltY = 0;
  const VIEW_X = -0.72;   // camera looks down on the plane
  const SIZE = 0.74;      // half-width of the plane, in units of R

  // Opinion distributions that rise out of the plane, one after another (every 4 s):
  // consensus (one peak) -> polarization (two camps) -> fragmentation (three clusters) -> ...
  // Each is a sum of Gaussian bumps: [x, z, height, width]. Opinion runs along x.
  const DISTS = [
    [[0, 0, 0.95, 0.3]],
    [[-0.58, 0, 0.82, 0.22], [0.58, 0, 0.82, 0.22]],
    [[-0.7, 0.32, 0.62, 0.17], [0.05, -0.38, 0.72, 0.18], [0.66, 0.3, 0.56, 0.16]],
  ];
  const PERIOD = 4, MORPH = 1.6;
  const smooth = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (x * 6 - 15) + 10);
  function phase(sec) {
    const k = Math.floor(sec / PERIOD), c = sec - k * PERIOD;
    return {
      from: DISTS[k % DISTS.length], to: DISTS[(k + 1) % DISTS.length],
      m: c < PERIOD - MORPH ? 0 : (c - (PERIOD - MORPH)) / MORPH,
    };
  }
  function height(dist, x, z) {
    let h = 0;
    for (const [bx, bz, a, w] of dist) {
      const dx = x - bx, dz = z - bz;
      h += a * Math.exp(-(dx * dx + dz * dz) / (2 * w * w));
    }
    return h;
  }

  function makePoints() {
    const n = 4200;
    const g = Math.round(Math.sqrt(n));
    pts = [];
    for (let i = 0; i < g; i++) {
      for (let j = 0; j < g; j++) {
        pts.push({
          gx: (i / (g - 1)) * 2 - 1, gz: (j / (g - 1)) * 2 - 1,
          ox: 0, oy: 0, vx: 0, vy: 0, // screen-space push away from the pointer
          size: 0.85 + Math.random() * 0.45,
        });
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const b = box.getBoundingClientRect();
    cx = b.left + b.width / 2; cy = b.top + b.height / 2 - b.height * 0.02; R = Math.min(b.width / 2, b.height * 0.62) * 0.95;
    makePoints();
  }

  const proj = [];
  let startAt = null;
  function frame(now) {
    if (startAt == null) startAt = now;
    const sec = (now - startAt) / 1000;
    if (!reduce) rotY += 0.0012;
    const tx = pointer.active ? ((pointer.y - cy) / H) * 0.35 : 0;
    const ty = pointer.active ? ((pointer.x - cx) / W) * 0.5 : 0;
    tiltX += (tx - tiltX) * 0.04; tiltY += (ty - tiltY) * 0.04;
    const ay = rotY + tiltY, ax = VIEW_X + tiltX;
    const sy = Math.sin(ay), cyy = Math.cos(ay), sx = Math.sin(ax), cxx = Math.cos(ax);
    const persp = 3.6, reach = R * 0.45, reach2 = reach * reach;
    const ph = reduce ? { from: DISTS[1], to: DISTS[1], m: 0 } : phase(sec);
    const m = smooth(ph.m);

    proj.length = 0;
    for (const p of pts) {
      const x = p.gx * SIZE, z = p.gz * SIZE;
      const r = Math.hypot(p.gx, p.gz);
      // the travelling wave, calmer towards the edges
      const wave = reduce ? 0 : (0.07 * Math.sin(r * 6 - sec * 2.2) + 0.035 * Math.sin((p.gx + p.gz) * 3 - sec * 1.4)) * (1 - r * 0.4);
      const hA = height(ph.from, p.gx, p.gz), hB = height(ph.to, p.gx, p.gz);
      const y = -(hA + (hB - hA) * m) - wave; // negative y is up
      const x1 = x * cyy + z * sy, z1 = -x * sy + z * cyy;   // rotate around y
      const y1 = y * cxx - z1 * sx, z2 = y * sx + z1 * cxx;  // then around x
      const s = persp / (persp - z2);
      const px = cx + x1 * R * s, py = cy + y1 * R * s;

      if (pointer.active && !reduce) {
        const dx = px + p.ox - pointer.x, dy = py + p.oy - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < reach2) {
          const d = Math.sqrt(d2) + 0.001, f = (1 - d / reach) ** 2 * 2.6;
          p.vx += (dx / d) * f; p.vy += (dy / d) * f;
        }
      }
      p.vx += -p.ox * 0.035; p.vy += -p.oy * 0.035;
      p.vx *= 0.86; p.vy *= 0.86;
      p.ox += p.vx; p.oy += p.vy;

      // fade the far edge of the plane into the page
      const edge = Math.max(0, Math.min(1, (1 - r / 1.45) * 3.2));
      proj.push({ x: px + p.ox, y: py + p.oy, z: z2, r: p.size * s * (R / 260), a: edge, h: -y });
    }
    proj.sort((a, b) => a.z - b.z); // back to front

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = DOT;
    for (const q of proj) {
      const depth = Math.max(0, Math.min(1, (q.z + SIZE) / (2 * SIZE)));
      // points on the peaks are a little stronger, so the distribution reads
      ctx.globalAlpha = q.a * Math.min(1, 0.5 + depth * 0.35 + q.h * 0.6);
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(0.5, q.r * (0.6 + depth * 0.6)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); if (reduce) frame(performance.now()); });
  window.addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
  document.addEventListener("mouseleave", () => { pointer.active = false; });
  window.addEventListener("blur", () => { pointer.active = false; });


  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
