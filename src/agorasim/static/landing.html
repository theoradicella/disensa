<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opinion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --page: #f5f8fc;
  --dot: #2a78d6;
  --accent: #1c5cab;
  --accent-hover: #184f95;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  min-height: 100vh; background: var(--page); overflow: hidden;
  font: 16px/1.5 "Geist", "Helvetica Neue", Arial, sans-serif;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.layout {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: clamp(28px, 6vh, 56px); padding: 16px; pointer-events: none;
}
/* the sphere is drawn on the canvas, centred on this box */
.ball { width: min(62vh, 78vw); aspect-ratio: 1; max-width: 100%; }
.enter {
  pointer-events: auto; display: inline-flex; align-items: center; justify-content: center;
  min-width: 184px; padding: 14px 28px; border-radius: 6px; border: 1px solid #0d366b;
  background: #104281; color: #fff; text-decoration: none; cursor: pointer;
  font: 500 15px/1 "Geist", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.02em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 1px 2px rgba(13, 54, 107, 0.2),
    0 8px 24px -8px rgba(13, 54, 107, 0.35);
  transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.enter:hover {
  background: #1c5cab;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 1px 2px rgba(13, 54, 107, 0.2),
    0 12px 28px -8px rgba(13, 54, 107, 0.45);
}
.enter:active { transform: translateY(1px); }
.enter:focus-visible { outline: 2px solid #0b0b0b; outline-offset: 3px; }
.topbar {
  position: fixed; z-index: 5; top: 16px; left: 50%; transform: translateX(-50%);
  width: min(560px, calc(100% - 32px)); height: 56px; padding: 0 12px 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  background: #ffffff; border: 1px solid rgba(16, 66, 129, 0.08); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(13, 30, 60, 0.05), 0 8px 24px -10px rgba(13, 30, 60, 0.16);
}
.mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; }
.mark:focus-visible, .nav-link:focus-visible { outline: 2px solid #0b0b0b; outline-offset: 2px; }
.nav-link {
  padding: 8px 14px; border-radius: 7px; color: #0b0b0b; text-decoration: none;
  font: 500 15px/1 "Geist", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.01em;
  transition: background .15s ease, color .15s ease;
}
.nav-link:hover { background: #eef3fa; color: #104281; }
.fade { position: fixed; inset: 0; background: var(--page); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.leaving .fade { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .enter, .fade { transition: none; } }
</style>
</head>
<body>
<canvas id="swarm" aria-hidden="true"></canvas>
<header class="topbar">
  <a class="mark" href="/" aria-label="Home">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <circle cx="11" cy="11" r="2.4" fill="#104281"/>
      <circle cx="5" cy="7" r="1.6" fill="#2a78d6"/><circle cx="16.5" cy="5.5" r="1.4" fill="#2a78d6" opacity=".75"/>
      <circle cx="17" cy="15" r="1.8" fill="#2a78d6" opacity=".9"/><circle cx="6.5" cy="16.5" r="1.3" fill="#2a78d6" opacity=".6"/>
      <circle cx="11" cy="3" r="1" fill="#2a78d6" opacity=".5"/><circle cx="11.5" cy="19.5" r="1" fill="#2a78d6" opacity=".5"/>
    </svg>
  </a>
  <nav><a class="nav-link" href="/lab">Lab</a></nav>
</header>
<div class="layout">
  <div class="ball" id="ball"></div>
  <a class="enter" id="enter" href="/lab">Enter the lab</a>
</div>
<div class="fade" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById("swarm");
  const ctx = canvas.getContext("2d");
  const ball = document.getElementById("ball");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DOT = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim();

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 200;
  let pts = [];
  const pointer = { x: -9999, y: -9999, active: false };
  let rotY = 0, tiltX = 0, tiltY = 0;
  const rotX = -0.35, rotXSheet = -0.95; // the square sheet is seen more from above

  // Shape cycle: ball -> morph -> waving square sheet -> morph -> ball (seconds)
  const HOLD_BALL = 6, MORPH = 2.2, HOLD_SHEET = 6.5;
  const CYCLE = HOLD_BALL + MORPH + HOLD_SHEET + MORPH;
  const smooth = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (x * 6 - 15) + 10);
  function sheetAmount(sec) { // 0 = ball, 1 = square
    const c = sec % CYCLE;
    if (c < HOLD_BALL) return 0;
    if (c < HOLD_BALL + MORPH) return (c - HOLD_BALL) / MORPH;
    if (c < HOLD_BALL + MORPH + HOLD_SHEET) return 1;
    return 1 - (c - HOLD_BALL - MORPH - HOLD_SHEET) / MORPH;
  }

  // points on a sphere (Fibonacci lattice) with a little radial depth so it reads as a ball,
  // each also given a place on a square grid; top of the ball maps to the back of the square
  function makePoints() {
    const n = Math.round(Math.min(2200, Math.max(900, (W * H) / 800)));
    const golden = Math.PI * (3 - Math.sqrt(5));
    const g = Math.ceil(Math.sqrt(n));
    pts = [];
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2;
      const r = Math.sqrt(1 - y * y);
      const th = golden * i;
      const depth = 0.86 + Math.random() * 0.16;
      pts.push({
        x: Math.cos(th) * r * depth, y: y * depth, z: Math.sin(th) * r * depth,
        ox: 0, oy: 0, vx: 0, vy: 0, // screen-space push away from the pointer
        gx: ((i % g) / (g - 1)) * 2 - 1, gz: (Math.floor(i / g) / (g - 1)) * 2 - 1,
        delay: i / n, // morph ripples through the points instead of all at once
        size: 1.0 + Math.random() * 1.0,
        wob: Math.random() * Math.PI * 2,
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const b = ball.getBoundingClientRect();
    cx = b.left + b.width / 2; cy = b.top + b.height / 2; R = (b.width / 2) * 0.92;
    makePoints();
  }

  const proj = [];
  let startAt = null; // the cycle starts on the ball when the page opens
  function frame(now) {
    // slow spin; the ball leans a little towards the pointer
    if (!reduce) rotY += 0.0022;
    const tx = pointer.active ? ((pointer.y - cy) / H) * 0.5 : 0;
    const ty = pointer.active ? ((pointer.x - cx) / W) * 0.6 : 0;
    tiltX += (tx - tiltX) * 0.04; tiltY += (ty - tiltY) * 0.04;
    if (startAt == null) startAt = now;
    const sec = (now - startAt) / 1000, amount = reduce ? 0 : sheetAmount(sec);
    const tiltSheet = smooth(amount);
    const ay = rotY + tiltY, ax = rotX + (rotXSheet - rotX) * tiltSheet + tiltX;
    const sy = Math.sin(ay), cyy = Math.cos(ay), sx = Math.sin(ax), cxx = Math.cos(ax);
    const persp = 3.2, reach = R * 0.55, reach2 = reach * reach;

    proj.length = 0;
    for (const p of pts) {
      const b = 1 + Math.sin(now * 0.0012 + p.wob) * 0.012; // gentle breathing
      // square sheet with travelling waves (a radial ripple plus a diagonal swell)
      const sxq = p.gx * 0.95, szq = p.gz * 0.95;
      const rr = Math.hypot(sxq, szq);
      const wave = 0.13 * Math.sin(rr * 7 - sec * 2.4) * (1 - rr * 0.35) + 0.06 * Math.sin((sxq + szq) * 3.2 - sec * 1.6);
      // each point morphs slightly after the previous ones
      const m = smooth(Math.min(1, Math.max(0, amount * 1.6 - p.delay * 0.6)));
      const x = (p.x + (sxq - p.x) * m) * b, y = (p.y + (wave - p.y) * m) * b, z = (p.z + (szq - p.z) * m) * b;
      const x1 = x * cyy + z * sy, z1 = -x * sy + z * cyy;   // rotate around y
      const y1 = y * cxx - z1 * sx, z2 = y * sx + z1 * cxx;  // then around x
      const s = persp / (persp - z2);
      const px = cx + x1 * R * s, py = cy + y1 * R * s;

      // dots move out of the pointer's way, then spring back into the ball
      if (pointer.active && !reduce) {
        const dx = px + p.ox - pointer.x, dy = py + p.oy - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < reach2) {
          const d = Math.sqrt(d2) + 0.001;
          const f = (1 - d / reach) ** 2 * 3.2 * (0.6 + 0.4 * (z2 + 1) / 2);
          p.vx += (dx / d) * f; p.vy += (dy / d) * f;
        }
      }
      p.vx += -p.ox * 0.035; p.vy += -p.oy * 0.035;
      p.vx *= 0.86; p.vy *= 0.86;
      p.ox += p.vx; p.oy += p.vy;

      proj.push({ x: px + p.ox, y: py + p.oy, z: z2, r: p.size * s * (R / 190) });
    }
    proj.sort((a, b) => a.z - b.z); // back to front

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = DOT;
    for (const q of proj) {
      const depth = (q.z + 1) / 2; // 0 = back, 1 = front
      ctx.globalAlpha = 0.18 + depth * 0.82;
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(0.5, q.r * (0.55 + depth * 0.75)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); if (reduce) frame(0); });
  window.addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
  document.addEventListener("mouseleave", () => { pointer.active = false; });
  window.addEventListener("blur", () => { pointer.active = false; });

  document.querySelectorAll('a[href="/lab"]').forEach((link) => link.addEventListener("click", (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    document.body.classList.add("leaving");
    setTimeout(() => { window.location.href = link.href; }, reduce ? 0 : 420);
  }));
  window.addEventListener("pageshow", () => document.body.classList.remove("leaving"));

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
