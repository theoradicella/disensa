# Fast local check: 10 agents, 5 days, small model. A few minutes on an M3 Pro.
name: quick
seed: 1
network: {topology: watts_strogatz, n: 10, k: 4, beta: 0.1}
opinions: {distribution: uniform}
topic:
  name: euthanasia
  statement: Euthanasia should be legal for terminally ill adults who clearly request it.
simulation:
  days: 5
  feed: {min_posts: 1, max_posts: 3}
  recommender: {enabled: true, threshold: 2.0}
  opinion_source: self
models:
  - name: ollama_chat/llama3.2:3b
scorer:
  name: ollama_chat/qwen2.5:7b
llm: {max_concurrency: 4}
