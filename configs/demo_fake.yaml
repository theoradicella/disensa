# The LLM pipeline with offline fake models: no Ollama, no API keys, a few seconds.
# Fake agents embed their position in their messages and move towards what they hear.
name: demo_fake
seed: 7
network: {topology: watts_strogatz, n: 60, k: 6, beta: 0.1}
opinions: {distribution: uniform}
steps: 30
dynamics:
  type: llm
  statement: Euthanasia should be legal for terminally ill adults who clearly request it.
  models:
    - {name: fake/bounded, weight: 2}
    - {name: fake/conformist, weight: 1}
    - {name: fake/stubborn, weight: 1}
  interactions: {min: 2, max: 5}
  max_concurrency: 64
