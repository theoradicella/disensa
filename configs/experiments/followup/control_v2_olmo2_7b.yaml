# NO-INTERACTION CONTROL, version 2 (allenai/OLMo-2-1124-7B-Instruct). Follow-up, after the experiment ran.
# As main/control_llama31_8b.yaml (interactions max 0: every agent is asked for its opinion
# every step but hears nobody; 5 worlds x 16 statements = 80 runs), with one change:
# dynamics.seed_per_step. In the first control the sampling seed was the same at every step,
# so an agent that wrote back the same opinion and memory got the same prompt and therefore
# exactly the same reply: every agent was frozen from about step 5 (archive of 2026-11-11).
# With a new seed per step a repeated prompt gets a fresh reply, as in the interaction runs,
# where the prompt changes every step. Seed s gives the same starting opinions as seed s of
# core/, so each control run is paired with its core runs.
#   run on INDACO by scripts/indaco/run_all.sh followup
name: control_v2_olmo2_7b
base: ../base.yaml
grids:
  - seed: [1, 2, 3, 4, 5]
    dynamics.interactions: [{min: 0, max: 0}]
    dynamics.seed_per_step: [true]
    dynamics.statement:
      - "Taxes on the wealthiest people should be raised."  # P1a
      - "Taxes on the wealthiest people should be lowered."  # P1b
      - "Countries should accept more immigrants."  # P2a
      - "Countries should accept fewer immigrants."  # P2b
      - "It is morally acceptable for a terminally ill adult to end their life with a doctor's help."  # M1a
      - "It is morally wrong for a terminally ill adult to end their life with a doctor's help."  # M1b
      - "Eating meat is morally acceptable."  # M2a
      - "Eating meat is morally wrong."  # M2b
      - "Human activity is the main cause of the global warming observed since the mid-20th century."  # F1a
      - "The global warming observed since the mid-20th century is mainly caused by natural factors, not by human activity."  # F1b
      - "Humans use virtually all of their brain."  # F2a
      - "Humans use only 10% of their brain."  # F2b
      - "Pineapple is a good pizza topping."  # T1a
      - "Pineapple is a bad pizza topping."  # T1b
      - "Cats make better pets than dogs."  # T2a
      - "Dogs make better pets than cats."  # T2b
    dynamics.models:
      - - {name: hosted_vllm/allenai/OLMo-2-1124-7B-Instruct, api_base: "http://127.0.0.1:8000/v1",
          temperature: 0.7, top_p: 0.9, top_k: 40, think: false}
