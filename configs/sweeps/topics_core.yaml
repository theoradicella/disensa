# The core LLM experiment: 4 topics × 3 seeds = 12 LLM runs, plus their numeric baselines
# on the same worlds (same seeds: same network, starting opinions and model placement).
#   disensa sweep configs/sweeps/topics_core.yaml --dry-run      # what would run
#   disensa sweep configs/sweeps/topics_core.yaml
# Run from the repository root (the base path is relative to it).
name: topics_core
base: configs/topics_base.yaml
grids:
  - seed: [1, 2, 3]
    replicate: [0]
    dynamics.statement:
      # TODO(Theo): choose the political, factual and trivial statements
      - "PLACEHOLDER political statement: replace before running."
      - "Euthanasia should be legal for terminally ill adults who clearly request it."  # moral
      - "PLACEHOLDER factual statement: replace before running."
      - "PLACEHOLDER trivial statement: replace before running."
  - seed: [1, 2, 3]   # paired numeric baselines, one world per seed
    dynamics:
      - {type: numeric, rule: degroot}
      - {type: numeric, rule: bounded_confidence, epsilon: 1.0, mu: 0.5}
      - {type: numeric, rule: friedkin_johnsen, stubbornness: 1.0}
