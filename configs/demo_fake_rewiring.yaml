# Offline demo with rewiring: agents unfollow people they disagree with.
name: demo_fake_rewiring
seed: 7
network: {topology: watts_strogatz, n: 60, k: 6, beta: 0.1}
opinions: {distribution: uniform}
simulation:
  days: 30
  feed: {min_posts: 2, max_posts: 5}
  recommender: {enabled: false}
  rewiring: {enabled: true, probability: 0.2, unfollow_threshold: 1.2, follow: similar, follow_threshold: 0.5}
assignment: clustered
models:
  - {name: fake/bounded, weight: 2}
  - {name: fake/conformist, weight: 1}
  - {name: fake/stubborn, weight: 1}
scorer:
  name: fake/scorer
llm: {max_concurrency: 64}
