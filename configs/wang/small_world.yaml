# Wang et al. (2025) replication, single model: 50 agents, 30 days, recommender on.
# Roughly 3,000 agent calls + 1,500 scorer calls: run overnight locally, or on a server.
name: wang_small_world
seed: 42
network: {topology: watts_strogatz, n: 50, k: 6, beta: 0.1}
opinions: {distribution: uniform}
topic:
  name: euthanasia
  statement: Euthanasia should be legal for terminally ill adults who clearly request it.
simulation:
  days: 30
  feed: {min_posts: 1, max_posts: 5}
  recommender: {enabled: true, threshold: 2.0}
  opinion_source: self
models:
  - name: ollama_chat/llama3.1:8b
scorer:
  name: ollama_chat/qwen2.5:7b
llm: {max_concurrency: 4}
