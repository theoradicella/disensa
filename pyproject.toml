[project]
name = "agorasim"
version = "0.0.1"
description = "Multi-model LLM-agent opinion dynamics on social networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Theo Radicella" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "networkx>=3.2",
    "pandas>=2.2",
    "pyarrow>=15",
    "litellm>=1.40",
    "diskcache>=5.6",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
analysis = [
    "duckdb>=1.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
]

[project.scripts]
agorasim = "agorasim.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agorasim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
