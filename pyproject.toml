[project]
name = "disensa"
version = "0.3.0"
description = "Opinion dynamics on social networks with numeric or (multi-model) LLM agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Theo Radicella" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "networkx>=3.2",
    "pandas>=2.2",
    "pyarrow>=15",
    "litellm>=1.40",
    "diskcache>=5.6",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]  # disensa analyze: the thesis figures

[project.urls]
Repository = "https://github.com/theoradicella/disensa"

[project.scripts]
disensa = "disensa.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disensa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/disensa/llm/prompts.py" = ["E501"]  # prompt templates are quoted verbatim
"tests/*" = ["E501"]
